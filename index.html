const firebaseConfig = {
  apiKey: "AIzaSyBG-xwxw6GuVhxL6mFsTlg0pJE6w_Oigtw",
  authDomain: "afiaty-app-c4d19.firebaseapp.com",
  databaseURL: "https://afiaty-app-c4d19-default-rtdb.firebaseio.com",
  projectId: "afiaty-app-c4d19",
  storageBucket: "afiaty-app-c4d19.firebasestorage.app",
  messagingSenderId: "517088634256",
  appId: "1:517088634256:web:491bcbdeda8acb5704ff15",
  measurementId: "G-D9KVXC9R2N"
};
const API_KEY = firebaseConfig.apiKey;
const DB_URL = "https://afiaty-app-c4d19-default-rtdb.firebaseio.com";
const app = {};
const db = {};
const auth = { currentUser: null };
let _authListener = null;
let _cachedToken = null; let _cachedExp = 0; let _refreshing = null; try{ const _s = JSON.parse(localStorage.getItem('afiaty_auth')||'null'); if(_s && _s.exp && Date.now() < _s.exp){ _cachedToken=_s.idToken; _cachedExp=_s.exp; } }catch(e){}
function _saveAuth(uid, idToken, refreshToken, expiresIn){
  const exp = Date.now() + (parseInt(expiresIn||3600)-60)*1000;
  _cachedToken = idToken; _cachedExp = exp;
  localStorage.setItem('afiaty_auth', JSON.stringify({uid, idToken, refreshToken, exp}));
  auth.currentUser = { uid, idToken };
}
function _loadAuth(){
  try{ const s = JSON.parse(localStorage.getItem('afiaty_auth')||'null'); if(s && s.uid){ auth.currentUser = { uid: s.uid, idToken: s.idToken }; return s; } }catch(e){}
  return null;
}
function _clearAuth(){ _cachedToken=null; _cachedExp=0; localStorage.removeItem('afiaty_auth'); auth.currentUser = null; }
async function _getToken(){
  if(_cachedToken && Date.now() < _cachedExp) return _cachedToken;
  let s = _loadAuth(); if(!s) return null;
  if(Date.now() < s.exp){ _cachedToken = s.idToken; _cachedExp = s.exp; return s.idToken; }
  if(_refreshing) return await _refreshing;
  _refreshing = (async ()=>{
    try{
      const r = await fetch('https://securetoken.googleapis.com/v1/token?key=' + API_KEY, { method:'POST', headers:{'Content-Type':'application/x-www-form-urlencoded'}, body: 'grant_type=refresh_token&refresh_token=' + encodeURIComponent(s.refreshToken) });
      const j = await r.json(); if(j.id_token){ _saveAuth(s.uid, j.id_token, j.refresh_token, j.expires_in); return j.id_token; }
    }catch(e){}
    return s.idToken;
  })();
  const tok = await _refreshing; _refreshing = null; return tok;
}
async function _authRequest(endpoint, body){
  try{
    const r = await fetch('https://identitytoolkit.googleapis.com/v1/' + endpoint + '?key=' + API_KEY, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body) });
    const j = await r.json(); return { ok: r.ok, data: j };
  }catch(e){ const err = new Error('network'); err.code='auth/network-request-failed'; throw err; }
}
async function createUserWithEmailAndPassword(authObj, email, password){
  const { ok, data } = await _authRequest('accounts:signUp', { email, password, returnSecureToken:true });
  if(!ok){
    const msg = data.error?.message || '';
    const err = new Error(msg);
    if(msg.includes('EMAIL_EXISTS')) err.code='auth/email-already-in-use';
    else if(msg.includes('WEAK_PASSWORD')) err.code='auth/weak-password';
    else if(msg.includes('INVALID_EMAIL')) err.code='auth/invalid-email';
    else err.code='auth/network-request-failed';
    throw err;
  }
  _saveAuth(data.localId, data.idToken, data.refreshToken, data.expiresIn);
  if(_authListener) setTimeout(()=>_authListener({ uid: data.localId }), 0);
  return { user: { uid: data.localId } };
}
async function signInWithEmailAndPassword(authObj, email, password){
  const { ok, data } = await _authRequest('accounts:signInWithPassword', { email, password, returnSecureToken:true });
  if(!ok){
    const msg = data.error?.message || '';
    const err = new Error(msg);
    if(msg.includes('INVALID_LOGIN_CREDENTIALS') || msg.includes('INVALID_PASSWORD') || msg.includes('EMAIL_NOT_FOUND')) err.code='auth/invalid-credential';
    else if(msg.includes('TOO_MANY_ATTEMPTS')) err.code='auth/too-many-requests';
    else err.code='auth/invalid-credential';
    throw err;
  }
  _saveAuth(data.localId, data.idToken, data.refreshToken, data.expiresIn);
  if(_authListener) setTimeout(()=>_authListener({ uid: data.localId }), 0);
  return { user: { uid: data.localId } };
}
async function signOut(authObj){ _clearAuth(); if(_authListener) _authListener(null); }
function onAuthStateChanged(authObj, cb){
  _authListener = cb;
  const s = _loadAuth();
  if(!s){ cb(null); return; }
  // إذا التوكن بعدة صالح، ادخل فورا بدون انتظار طلب تجديد - هذا كان يأخر الدخول ثواني
  if(s.exp && Date.now() < s.exp - 5000){ cb({ uid: s.uid }); return; }
  (async ()=>{
    const tok = await _getToken();
    if(!tok){ cb(null); return; }
    cb({ uid: s.uid });
  })();
}
async function updatePassword(userObj, newPass){
  const tok = await _getToken(); if(!tok) throw new Error('need re-login');
  const { ok, data } = await _authRequest('accounts:update', { idToken: tok, password: newPass, returnSecureToken:true });
  if(!ok) throw new Error(data.error?.message || 'update failed');
  if(data.idToken) _saveAuth(data.localId, data.idToken, data.refreshToken, data.expiresIn);
}
async function deleteUser(userObj){
  const tok = await _getToken(); if(!tok) throw new Error('need re-login');
  const { ok, data } = await _authRequest('accounts:delete', { idToken: tok });
  if(!ok) throw new Error(data.error?.message || 'delete failed');
  _clearAuth();
}
async function sendPasswordResetEmail(email){
  const { ok, data } = await _authRequest('accounts:sendOobCode', { requestType: 'PASSWORD_RESET', email });
  if(!ok){
    const msg = data.error?.message || '';
    const err = new Error(msg);
    if(msg.includes('EMAIL_NOT_FOUND')) err.code='auth/user-not-found';
    else if(msg.includes('INVALID_EMAIL')) err.code='auth/invalid-email';
    else err.code='auth/network-request-failed';
    throw err;
  }
  return true;
}
async function updateEmailAddress(newEmail){
  const tok = await _getToken(); if(!tok) throw new Error('need re-login');
  const { ok, data } = await _authRequest('accounts:update', { idToken: tok, email: newEmail, returnSecureToken:true });
  if(!ok) throw new Error(data.error?.message || 'update email failed');
  if(data.idToken) _saveAuth(data.localId, data.idToken, data.refreshToken, data.expiresIn);
  return data;
}
// Lookup Auth email by phone - public read of single phone node, no auth needed
async function lookupAuthEmailByPhone(phone){
  const vars = phoneVariants(phone);
  // الأغلب يستخدم الصيغة 0770... فنجربها أولا وحدها - أسرع بكثير
  try{
    const r = await fetch(DB_URL + '/sehaty_phone_to_email/' + encodeURIComponent(vars[0]) + '.json');
    const j = await r.json().catch(()=>null);
    if(j && j.email) return j;
  }catch(e){}
  if(vars.length<=1) return null;
  // إذا ما لقيناها، نجرب باقي الصيغ كلها بنفس الوقت، مو واحد ورا واحد
  try{
    const results = await Promise.all(vars.slice(1).map(async v=>{ try{ const r=await fetch(DB_URL + '/sehaty_phone_to_email/' + encodeURIComponent(v) + '.json'); return await r.json().catch(()=>null); }catch(e){ return null; } }));
    for(const j of results){ if(j && j.email) return j; }
  }catch(e){}
  return null;
}
async function savePhoneMapping(phone, email, uid, recoveryEmail){
  try{
    const norm = normalizePhone(phone);
    await _dbFetch('sehaty_phone_to_email/' + norm, 'PUT', { email, uid, recoveryEmail: recoveryEmail||'' });
  }catch(e){ console.warn('savePhoneMapping failed', e); }
}
function isRealEmail(email){
  return email && !email.endsWith('@afiaty.app') && email.includes('@') && email.includes('.');
}
function isValidEmail(email){
  return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email||'');
}
function ref(dbObj, path){ return { path: path }; }
function orderByChild(child){ return { orderBy: child }; }
function equalTo(val){ return { equalTo: val }; }
function query(refObj, orderByObj, equalToObj){ return { isQuery:true, path: refObj.path, orderBy: orderByObj?.orderBy, equalTo: equalToObj?.equalTo }; }
function _genPushId(){ return '-' + Date.now().toString(36) + Math.random().toString(36).slice(2,10); }
function push(refObj){ const id = _genPushId(); return { path: refObj.path + '/' + id, pushId: id }; }
async function _dbFetch(path, method, body){
  const tok = await _getToken();
  let url = DB_URL + '/' + path + '.json';
  if(tok) url += '?auth=' + encodeURIComponent(tok);
  const opts = { method };
  if(body !== undefined){ opts.headers = { 'Content-Type':'application/json' }; opts.body = JSON.stringify(body); }
  const r = await fetch(url, opts);
  const j = await r.json().catch(()=>null);
  if(j && j.error) throw new Error(j.error);
  return j;
}
async function get(refOrQuery){
  if(refOrQuery.isQuery){
    const tok = await _getToken();
    let url = DB_URL + '/' + refOrQuery.path + '.json?orderBy=' + encodeURIComponent(JSON.stringify(refOrQuery.orderBy)) + '&equalTo=' + encodeURIComponent(JSON.stringify(refOrQuery.equalTo));
    if(tok) url += '&auth=' + encodeURIComponent(tok);
    const r = await fetch(url); const j = await r.json().catch(()=>null);
    if(j && j.error) throw new Error(j.error);
    return { exists: ()=> j !== null && j !== undefined, val: ()=> j };
  } else {
    const j = await _dbFetch(refOrQuery.path, 'GET');
    return { exists: ()=> j !== null && j !== undefined, val: ()=> j };
  }
}
async function set(refObj, data){ return await _dbFetch(refObj.path, 'PUT', data); }
async function update(refObj, data){ return await _dbFetch(refObj.path, 'PATCH', data); }
async function remove(refObj){ return await _dbFetch(refObj.path, 'DELETE'); }
function onValue(){}

const $ = s => document.querySelector(s);
const appEl = document.getElementById('app');
const toastWrap = document.getElementById('toastWrap');
let profile = null;
let currentTab = 'home';
let selectedPatientUid = null;
let selectedPatientProfile = null;
let cache = { measurements:{}, medicines:{}, reminders:{}, notes:{}, requests:[], doctorPatients:{}, link:null };

function toast(msg, ms=3500){ const d=document.createElement('div'); d.className='toast'; d.textContent=msg; toastWrap.appendChild(d); setTimeout(()=>d.remove(), ms); }
function esc(s){ return String(s??'').replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function normalizePhone(phone){ let d = String(phone||'').replace(/\D/g,''); if(!d) return ''; if(d.startsWith('00964')) d = '0' + d.slice(5); else if(d.startsWith('964') && d.length>=12) d = '0' + d.slice(3); else if(d.length===10 && d.startsWith('77')) d = '0' + d; return d; }
function phoneVariants(phone){ const c = normalizePhone(phone); const raw = String(phone||'').replace(/\D/g,''); const list = []; const push = v=>{ if(v && !list.includes(v)) list.push(v); }; push(c); push(raw); if(c.startsWith('0')){ push('964'+c.slice(1)); push('00964'+c.slice(1)); push(c.slice(1)); } if(raw.startsWith('964')) push('0'+raw.slice(3)); if(raw.startsWith('00964')) push('0'+raw.slice(5)); return list; }
function derivedEmail(phone){ return `u${normalizePhone(phone)}@afiaty.app`; }
function genCode(){ return 'DR-' + Math.floor(1000+Math.random()*9000); }
function fmtTime(t){ try{ return new Date(t).toLocaleString('ar-IQ',{dateStyle:'medium',timeStyle:'short'}); }catch(e){ return t||''; } }
function todayStr(){ return new Date().toISOString().slice(0,10); }

async function loadProfile(uid){
  try{
    const snap = await get(ref(db, 'sehaty_profiles/'+uid));
    return snap.exists() ? snap.val() : null;
  }catch(e){ console.warn('loadProfile failed for', uid, e.message); return null; }
}
async function safeGetObj(path){
  try{
    const s = await get(ref(db, path));
    return s.exists() ? s.val() : {};
  }catch(e){ return {}; }
}
async function loadOwnerData(ownerUid){
  // Doctor is NOT allowed to read patient's reminders by rules (private), so never let one collection fail the whole file
  const [m, med, rem, notes] = await Promise.all([
    safeGetObj('sehaty_measurements/'+ownerUid),
    safeGetObj('sehaty_medicines/'+ownerUid),
    safeGetObj('sehaty_reminders/'+ownerUid),
    safeGetObj('sehaty_notes/'+ownerUid),
  ]);
  cache.measurements = m || {};
  cache.medicines = med || {};
  cache.reminders = rem || {};
  cache.notes = notes || {};
}
async function loadLink(){
  if(!profile) return; const s = await get(ref(db, 'sehaty_links/'+profile.uid)); cache.link = s.exists()? s.val() : null;
}
async function loadDoctorData(){
  const snap = await get(ref(db, 'sehaty_doctor_patients/'+profile.uid));
  cache.doctorPatients = snap.exists()? snap.val() : {};
  // requests for doctor
  try{
    const q = query(ref(db,'sehaty_requests'), orderByChild('doctorUid'), equalTo(profile.uid));
    const rs = await get(q); cache.requests = rs.exists()? Object.entries(rs.val()).map(([id,v])=>({id,...v})) : [];
  }catch(e){ cache.requests=[]; }
}
async function loadPatientRequests(){
  try{
    const q = query(ref(db,'sehaty_requests'), orderByChild('patientUid'), equalTo(profile.uid));
    const rs = await get(q); cache.requests = rs.exists()? Object.entries(rs.val()).map(([id,v])=>({id,...v})) : [];
  }catch(e){ cache.requests=[]; }
}

function renderRegister(){
  appEl.innerHTML = `

    <div class="flex"><button class="btn ghost" onclick="window.goChoice()">← عودة</button><h2 style="margin:0">تسجيل حساب جديد</h2></div>

// ---------- ANALYSIS ----------
function analyze(measurements){
  const arr = Object.values(measurements||{}).sort((a,b)=> new Date(b.time)-new Date(a.time));
  if(!arr.length) return ['أضف قياسا جديدا لكي يظهر التحليل هنا.'];
  const out=[]; const last = arr[0];
  if(last.type==='ضغط' && last.sys){
    if(last.sys>=180 || last.dia>=120) out.push('انتبه: الضغط مرتفع جدا بشكل حرج. اجلس واسترح 15 دقيقة ثم أعد القياس، وتواصل مع طبيبك.');
    else if(last.sys>=140 || last.dia>=90) out.push('الضغط أعلى من النطاق العام. قلل الملح اليوم، وامش مشيا خفيفا إذا كان ذلك مناسبا لك.');
    else if(last.sys<90 || last.dia<60) out.push('الضغط أقل من النطاق العام. لا تقم فجأة، اشرب ماء، وأعد القياس بعد قليل.');
    else out.push('الضغط ضمن النطاق العام.');
  }
  if(last.type==='سكر' && last.value){
    if(last.value>=250) out.push('قراءة السكر حرجة جدا. تواصل مع طبيبك.');
    else if(last.value<70) out.push('السكر أقل من النطاق العام. اجلس، وتناول شيئا حلوا سريع الامتصاص إذا كان طبيبك قد نصحك بذلك من قبل، وأعد القياس بعد 15 دقيقة.');
    else if(last.value>180) out.push('السكر أعلى من النطاق العام. تجنب الحلويات الآن، واشرب ماء، وسجل القراءة التالية.');
    else out.push('السكر ضمن النطاق العام.');
  }
  out.push('ملاحظة ثابتة: هذا التحليل تعليمي عام من بيانات أدخلتها أنت، وليس تشخيصا، وقرار العلاج يبقى لطبيبك.');
  return out;
}

window.doRegister = async ()=>{
  const name=document.getElementById('r_name').value.trim(); const phone=document.getElementById('r_phone').value.trim();
  const pass=document.getElementById('r_pass').value; const pass2=document.getElementById('r_pass2').value;
  const recoveryEmail=(document.getElementById('r_email')?.value||'').trim().toLowerCase();
  const errEl=document.getElementById('regErr');
  const btnReg=document.getElementById('btnReg');
  if(btnReg){ btnReg.disabled=true; btnReg.textContent='جارٍ إنشاء الحساب...'; }
  if(!name||!phone){ errEl.textContent='أدخل الاسم الكامل ورقم الهاتف أولا'; return; }
  if(recoveryEmail && !isValidEmail(recoveryEmail)){ errEl.textContent='صيغة الإيميل غير صحيحة، مثال: name@gmail.com'; return; }
  if(!pass||pass.length<6){ errEl.textContent='اختر كلمة سر من 6 أحرف على الأقل'; return; }
  if(pass!==pass2){ errEl.textContent='كلمة السر وتأكيدها غير متطابقين'; return; }
  const role = window._role||'patient';
  const authEmail = recoveryEmail ? recoveryEmail : derivedEmail(phone);
  try{
    const cred = await createUserWithEmailAndPassword(auth, authEmail, pass);
    const uid = cred.user.uid;
    let prof = { uid, name, phone: normalizePhone(phone), role, createdAt: new Date().toISOString(), recoveryEmail: recoveryEmail||'', authEmail };
    if(role==='patient'){
      prof.age = document.getElementById('r_age').value.trim()||'';
      prof.gender = document.getElementById('r_gender').value;
      prof.conditions = Array.from(document.querySelectorAll('.cond:checked')).map(c=>c.value);
    } else {
      prof.specialty = document.getElementById('r_spec').value;
      prof.clinic = document.getElementById('r_clinic').value.trim();
      // كود واحد فقط، بدون فحص 20 مرة - الفحص كان هو سبب الثقل
      const code = genCode();
      prof.code = code;
      prof._doctorCodeData = { uid, name, specialty: prof.specialty, clinic: prof.clinic||'' };
    }
    // حفظ الملف + كود الطبيب + ربط الرقم كلها بنفس الوقت، مو واحد ورا واحد - أسرع 3 مرات
    if(errEl) errEl.textContent='تم إنشاء الحساب، جارٍ حفظ ملفك...';
    const saves = [ set(ref(db,'sehaty_profiles/'+uid), prof), savePhoneMapping(phone, authEmail, uid, recoveryEmail) ];
    if(prof._doctorCodeData){ saves.push(set(ref(db,'sehaty_doctor_codes/'+prof.code), prof._doctorCodeData)); delete prof._doctorCodeData; }
    await Promise.all(saves);
    profile=prof; toast(recoveryEmail ? 'تم إنشاء الحساب بنجاح، وتم ربط إيميل الاسترجاع' : 'تم إنشاء الحساب بنجاح');
    if(role==='patient'){ currentTab='home'; await renderPatient(); } else { currentTab='home'; await renderDoctor(); }
  }catch(e){
    console.error(e);
    if(btnReg){ btnReg.disabled=false; btnReg.textContent='إنشاء الحساب والدخول'; }
    if(e.code==='auth/email-already-in-use') errEl.textContent = recoveryEmail ? 'هذا الإيميل مستخدم لحساب آخر، استخدم إيميل ثاني أو سجل دخول.' : 'هذا الرقم مسجل مسبقا. إذا نسيت كلمة السر، اضغط نسيت كلمة السر في شاشة الدخول إذا كان عندك إيميل استرجاع، أو امسح الحساب من Authentication ثم سجل من جديد.';
    else if(e.code==='auth/invalid-email') errEl.textContent='رقم الهاتف غير صحيح';
    else if(e.code==='auth/weak-password') errEl.textContent='كلمة السر ضعيفة، اختر 6 أحرف على الأقل';
    else if(e.code==='auth/network-request-failed') errEl.textContent='تعذر الوصول إلى Firebase، تأكد من الإنترنت';
    else errEl.textContent='تعذر إنشاء الحساب: '+(e.message||'');
  }
};
window.doLogin = async ()=>{
  const phone=document.getElementById('l_phone').value.trim(); const pass=document.getElementById('l_pass').value;
  const errEl=document.getElementById('loginErr');
  const btn=document.getElementById('btnLogin');
  if(!phone||!pass){ errEl.textContent='أدخل رقم الهاتف وكلمة السر'; return; }
  if(btn){ btn.disabled=true; btn.textContent='جارٍ الدخول…'; }
  if(errEl) errEl.textContent='جارٍ التحقق من رقمك… اكتب الرقم بنفس الصيغة اللي سجلت بيها: 0770...';
  try{
    // إذا لقينا ربط الرقم، نجرب إيميله فقط. إذا ما لقينا ربط، نجرب الإيميل المشتق فقط. تجربة الاثنين كانت تضاعف وقت الخطأ
    const m = await lookupAuthEmailByPhone(phone).catch(()=>null);
    let authEmail = (m && m.email) ? m.email : derivedEmail(phone);
    try{ await signInWithEmailAndPassword(auth, authEmail, pass); }
    catch(e){
      // إذا فشل بالربط، جرب المشتق مرة واحدة فقط إذا كان مختلف - للحسابات القديمة
      if(m && m.email && m.email !== derivedEmail(phone) && e.code!=='auth/too-many-requests'){
        await signInWithEmailAndPassword(auth, derivedEmail(phone), pass);
      } else throw e;
    }
    if(errEl) errEl.textContent='تم الدخول بنجاح، جارٍ تحميل حسابك…';
  }catch(e){
    if(btn){ btn.disabled=false; btn.textContent='دخول'; }
    if(e.code==='auth/invalid-credential' || e.code==='auth/user-not-found' || e.code==='auth/wrong-password') errEl.textContent='رقم الهاتف أو كلمة السر غير صحيحة. تأكد: 1) أنك سجلت حساب جديد بعد النسخة الآمنة (الحسابات القديمة انمسحت وما تدخل) 2) أن الرقم بنفس الصيغة 0770... 3) أن كلمة السر 6 أحرف على الأقل. إذا نسيت كلمة السر، استخدم صندوق نسيت كلمة السر بالأسفل.';
    else if(e.code==='auth/too-many-requests') errEl.textContent='محاولات كثيرة، انتظر 5 دقائق ثم حاول مرة أخرى';
    else errEl.textContent='تعذر الدخول: '+(e.message||'');
    return;
  }
  if(btn){ btn.disabled=false; btn.textContent='دخول'; }
};

window.doForgot = async ()=>{
  const phone=(document.getElementById('f_phone')?.value||'').trim();
  const msgEl=document.getElementById('forgotMsg');
  const btn=document.getElementById('btnForgot');
  if(!phone){ if(msgEl) msgEl.textContent='أدخل رقم الهاتف أولا'; return; }
  if(btn){ btn.disabled=true; btn.textContent='جارٍ الإرسال…'; }
  if(msgEl) msgEl.textContent='جارٍ البحث عن إيميلك المرتبط برقم ' + normalizePhone(phone) + ' ...';
  try{
    const m = await lookupAuthEmailByPhone(phone);
    if(!m || !m.email || !isRealEmail(m.email)){
      if(msgEl) msgEl.textContent='هذا الرقم (' + normalizePhone(phone) + ') ما عنده إيميل استرجاع. هذا يصير إذا سجلت حسابك بدون إيميل، أو سجلت برقم مختلف (مثلا سجلت بـ 0770 ودخلت بـ 964). الحل: سجل حساب جديد بنفس الرقم ومع إيميل حقيقي، أو إذا كنت داخل حسابك ضيف إيميل من ملفك.';
      if(btn){ btn.disabled=false; btn.textContent='إرسال رابط الاسترجاع إلى إيميلي'; }
      return;
    }
    await sendPasswordResetEmail(m.email);
    if(msgEl) msgEl.textContent='تم ✅ إرسال رابط الاسترجاع إلى ' + m.email + '. افتح إيميلك (حتى مجلد السبام) واضغط على الرابط، واختر كلمة سر جديدة، ثم ارجع وسجل دخول بنفس الرقم وكلمة السر الجديدة.';
    toast('تم إرسال رابط الاسترجاع إلى إيميلك');
  }catch(e){
    console.error(e);
    if(msgEl) msgEl.textContent = e.code==='auth/user-not-found' ? 'ما لقينا حساب بهذا الإيميل' : 'تعذر إرسال الرابط: ' + (e.message||'');
  }
  if(btn){ btn.disabled=false; btn.textContent='إرسال رابط الاسترجاع إلى إيميلي'; }
};

window.addMeasurement = async ()=>{

  else if(type==='سكر'){ data.value=document.getElementById('m_val').value; data.sugarType=document.getElementById('m_sugarType').value; if(!data.value){ toast('أدخل قيمة القياس'); return; } }

window.delMed = async (id)=>{ if(!confirm('تأكيد الحذف؟')) return; await remove(ref(db,'sehaty_medicines/'+profile.uid+'/'+id)); toast('تم الحذف'); await renderPatient(); };
window.toggleTaken = async (id, val)=>{ await update(ref(db,'sehaty_medicines/'+profile.uid+'/'+id), {takenToday: !!val}); toast(val?'أحسنت، تم تسجيل جرعة اليوم':'تم إلغاء تسجيل الجرعة'); await renderPatient(); };
window.addReminder = async ()=>{
  const data={ type: document.getElementById('rem_type').value, time: document.getElementById('rem_time').value, repeat: document.getElementById('rem_repeat').value, note: document.getElementById('rem_note').value, active:true, ownerUid: profile.uid, createdAt: new Date().toISOString() };
  const nr=push(ref(db,'sehaty_reminders/'+profile.uid)); await set(nr,data); toast('تمت إضافة التذكير'); await renderPatient();
};
window.toggleRem = async (id, val)=>{ await update(ref(db,'sehaty_reminders/'+profile.uid+'/'+id), {active: !!val}); await renderPatient(); };
window.delRem = async (id)=>{ if(!confirm('تأكيد الحذف؟')) return; await remove(ref(db,'sehaty_reminders/'+profile.uid+'/'+id)); await renderPatient(); };
window.copyReport = async ()=>{ const txt = window._lastReport || ''; try{ await navigator.clipboard.writeText(txt); toast('تم النسخ'); }catch(e){ toast(txt); } };
window.shareWa = ()=>{ const txt = window._lastReport || ''; const n=document.getElementById('waNum').value.trim(); if(!n){ toast('أدخل رقم الواتساب أولا'); return; } window.open('https://wa.me/'+n.replace(/\D/g,'')+'?text='+encodeURIComponent(txt),'_blank'); };
window.saveProfile = async ()=>{ const upd={ name: document.getElementById('p_name').value.trim(), age: document.getElementById('p_age').value.trim(), gender: document.getElementById('p_gender').value, conditions: document.getElementById('p_conds').value.split('،').map(s=>s.trim()).filter(Boolean) }; await update(ref(db,'sehaty_profiles/'+profile.uid), upd); profile={...profile,...upd}; toast('تم تعديل ملفك الشخصي بنجاح'); await renderPatient(); };
window.changePass = async ()=>{ const np=document.getElementById('newPass').value; if(!np||np.length<6){ toast('اختر كلمة سر جديدة من 6 أحرف على الأقل'); return; } try{ await updatePassword(auth.currentUser, np); toast('تم تغيير كلمة السر، سجل الدخول الآن'); }catch(e){ toast('تعذر تغيير كلمة السر، سجل خروج ودخول مرة أخرى ثم حاول'); } };
window.changePassDoctor = async ()=>{ const np=document.getElementById('newPassD').value; if(!np||np.length<6){ toast('اختر كلمة سر جديدة من 6 أحرف على الأقل'); return; } try{ await updatePassword(auth.currentUser, np); toast('تم تغيير كلمة السر'); }catch(e){ toast('تعذر تغيير كلمة السر، سجل خروج ودخول مرة أخرى ثم حاول'); } };
window.saveRecoveryEmail = async ()=>{
  const email=(document.getElementById('recoveryEmailInput')?.value||'').trim().toLowerCase();
  if(!email || !isValidEmail(email)){ toast('أدخل إيميل صحيح، مثال: name@gmail.com'); return; }
  try{
    await updateEmailAddress(email);
    await update(ref(db,'sehaty_profiles/'+profile.uid), { recoveryEmail: email, authEmail: email });
    await savePhoneMapping(profile.phone, email, profile.uid, email);
    profile={...profile, recoveryEmail: email, authEmail: email};
    toast('تم حفظ إيميل الاسترجاع، هسه تكدر تسترجع كلمة السر بالإيميل');
    await renderPatient();
  }catch(e){ toast('تعذر حفظ الإيميل: '+(e.message||'')+' - إذا كان الإيميل مستخدم لحساب آخر، استخدم إيميل ثاني'); }
};
window.saveRecoveryEmailDoctor = async ()=>{
  const email=(document.getElementById('recoveryEmailInputD')?.value||'').trim().toLowerCase();
  if(!email || !isValidEmail(email)){ toast('أدخل إيميل صحيح، مثال: name@gmail.com'); return; }
  try{
    await updateEmailAddress(email);
    await update(ref(db,'sehaty_profiles/'+profile.uid), { recoveryEmail: email, authEmail: email });
    await savePhoneMapping(profile.phone, email, profile.uid, email);
    profile={...profile, recoveryEmail: email, authEmail: email};
    toast('تم حفظ إيميل الاسترجاع');
    await renderDoctor();
  }catch(e){ toast('تعذر حفظ الإيميل: '+(e.message||'')); }
};
window.sendLinkRequest = async ()=>{
  const code=document.getElementById('linkCode').value.trim().toUpperCase(); if(!code){ toast('أدخل كود الطبيب'); return; }
  try{
    const cs = await get(ref(db,'sehaty_doctor_codes/'+code)); if(!cs.exists()){ toast('كود الطبيب غير صحيح، تأكد من الكود مع طبيب مسجل'); return; }
    const doc = cs.val(); if(cache.link && cache.link.doctorUid===doc.uid){ toast('أنت مربوط بهذا الطبيب بالفعل'); return; }
    if(cache.link && cache.link.doctorUid){ toast('أنت مربوط بطبيب آخر، ألغِ الربط أولا لتغيير الطبيب'); return; }
    if(cache.requests.find(r=>r.doctorUid===doc.uid && r.status==='pending')){ toast('لديك طلب ربط قيد الانتظار لدى هذا الطبيب، انتظر قبوله'); return; }
    const nr=push(ref(db,'sehaty_requests')); await set(nr, { doctorUid: doc.uid, doctorCode: code, doctorName: doc.name, patientUid: profile.uid, patientName: profile.name, patientPhone: profile.phone, status:'pending', createdAt: new Date().toISOString() });
    toast('تم إرسال طلب الربط، انتظر قبوله'); await renderPatient();
  }catch(e){ toast('تعذر إرسال الطلب: '+e.message); }
};
window.unlinkDoctor = async ()=>{
  if(!confirm('تأكيد إلغاء الربط مع الطبيب؟')) return;
  try{
    if(cache.link?.doctorUid) await remove(ref(db,'sehaty_doctor_patients/'+cache.link.doctorUid+'/'+profile.uid));
    await remove(ref(db,'sehaty_links/'+profile.uid)); toast('تم إلغاء الربط مع الطبيب'); await renderPatient();
  }catch(e){ toast('تعذر إلغاء الربط: '+e.message); }
};
window.deleteAccount = async ()=>{
  const w=document.getElementById('delWord').value.trim(); if(w!=='حذف'){ toast('اكتب كلمة حذف بالضبط للتأكيد'); return; }
  if(!confirm('حذف نهائي؟ لا يمكن التراجع.')) return;
  try{
    const uid=profile.uid;
    if(cache.link?.doctorUid) { try{ await remove(ref(db,'sehaty_doctor_patients/'+cache.link.doctorUid+'/'+uid)); }catch(e){} }
    await remove(ref(db,'sehaty_measurements/'+uid)); await remove(ref(db,'sehaty_medicines/'+uid)); await remove(ref(db,'sehaty_reminders/'+uid)); await remove(ref(db,'sehaty_notes/'+uid)); await remove(ref(db,'sehaty_links/'+uid));
    // delete own requests
    for(let r of cache.requests){ try{ await remove(ref(db,'sehaty_requests/'+r.id)); }catch(e){} }
    await remove(ref(db,'sehaty_profiles/'+uid));
    await deleteUser(auth.currentUser); profile=null; toast('تم حذف الحساب'); renderAuthChoice();
  }catch(e){ toast('تعذر حذف الحساب، سجل خروج ودخول مرة أخرى ثم حاول: '+e.message); }
};
// Doctor actions
window.copyText = async (t)=>{ try{ await navigator.clipboard.writeText(t); toast('تم النسخ'); }catch(e){ toast(t); } };
window.filterPatients = ()=>{ const q=(document.getElementById('searchPat').value||'').toLowerCase(); document.querySelectorAll('.patItem').forEach(el=>{ el.style.display = el.dataset.name.includes(q)?'block':'none'; }); };
window.openPatient = async (uid)=>{
  try{
    // Show immediate feedback so doctor knows button worked
    const btns = document.querySelectorAll('button');
    selectedPatientUid = uid;
    currentTab = 'patients';
    // Try to load profile, but even if it fails, still render (patientProfiles in renderDoctor will retry)
    try{ selectedPatientProfile = await loadProfile(uid); }catch(e){ selectedPatientProfile = selectedPatientProfile || null; }
    await renderDoctor();
    // Scroll to patient file card after render
    setTimeout(()=>{ const el = document.querySelector('h2'); window.scrollTo({top: 0, behavior: 'smooth'}); }, 100);
  }catch(e){
    console.error('openPatient failed', e);
    toast('تعذر فتح ملف المريض: ' + (e.message || 'حاول مرة أخرى'));
  }
};
window.closePatient = async ()=>{ selectedPatientUid=null; selectedPatientProfile=null; await renderDoctor(); };
window.acceptReq = async (rid, patientUid, patientName, patientPhone)=>{
  try{
    await update(ref(db,'sehaty_requests/'+rid), {status:'accepted'});
    await set(ref(db,'sehaty_doctor_patients/'+profile.uid+'/'+patientUid), { patientName, patientPhone, linkedAt: new Date().toISOString(), status:'accepted' });
    await set(ref(db,'sehaty_links/'+patientUid), { doctorUid: profile.uid, doctorName: profile.name, doctorCode: profile.code, doctorPhone: profile.phone, status:'accepted', updatedAt: new Date().toISOString() });
    toast('تم قبول طلب الربط، وأضيف المريض إلى قائمتك'); await renderDoctor();
  }catch(e){ toast('تعذر قبول الطلب: '+e.message); }
};
window.rejectReq = async (rid)=>{ await update(ref(db,'sehaty_requests/'+rid), {status:'rejected'}); toast('تم الرفض'); await renderDoctor(); };
window.unlinkPatient = async (patientUid)=>{ if(!confirm('إلغاء ربط هذا المريض؟')) return; await remove(ref(db,'sehaty_doctor_patients/'+profile.uid+'/'+patientUid)); await remove(ref(db,'sehaty_links/'+patientUid)); toast('تم إلغاء الربط'); await renderDoctor(); };
window.addNote = async (patientUid)=>{ const text=document.getElementById('noteText').value.trim(); if(!text){ toast('اكتب ملاحظتك الطبية'); return; } const nr=push(ref(db,'sehaty_notes/'+patientUid)); await set(nr, { patientUid, doctorUid: profile.uid, doctorName: profile.name, text, date: new Date().toISOString(), createdAt: new Date().toISOString() }); toast('تم حفظ ملاحظة الطبيب'); await renderDoctor(); };
window.delNote = async (patientUid, nid)=>{ if(!confirm('حذف الملاحظة؟')) return; await remove(ref(db,'sehaty_notes/'+patientUid+'/'+nid)); await renderDoctor(); };
window.doctorAddMeas = async (patientUid)=>{
  const type=document.getElementById('dm_type').value; const time=document.getElementById('dm_time').value || new Date().toISOString();
  let data={ type, time: new Date(time).toISOString(), notes:'أضيف من الطبيب', ownerUid: patientUid, createdBy: profile.uid, createdAt: new Date().toISOString() };
  if(type==='ضغط'){ data.sys=document.getElementById('dm_sys').value; data.dia=document.getElementById('dm_dia').value; if(!data.sys||!data.dia){ toast('أدخل قيمتي الضغط'); return; } }
  else { data.value=document.getElementById('dm_val').value; if(!data.value){ toast('أدخل القيمة'); return; } }
  const nr=push(ref(db,'sehaty_measurements/'+patientUid)); await set(nr,data); toast('تمت إضافة قياس للمريض بنجاح'); await renderDoctor();
};
window.doctorAddMed = async (patientUid)=>{
  const name=document.getElementById('dm_med').value.trim(); if(!name){ toast('أدخل اسم الدواء'); return; }
  const nr=push(ref(db,'sehaty_medicines/'+patientUid)); await set(nr, { name, dose: document.getElementById('dm_dose').value, time:'', note:'أضيف من الطبيب', ownerUid: patientUid, takenToday:false, createdAt: new Date().toISOString() }); toast('تمت إضافة دواء للمريض بنجاح'); await renderDoctor();
};
window.saveDoctorProfile = async ()=>{
  const upd={ name: document.getElementById('d_name').value.trim(), specialty: document.getElementById('d_spec').value.trim(), clinic: document.getElementById('d_clinic').value.trim() };
  await update(ref(db,'sehaty_profiles/'+profile.uid), upd);
  if(profile.code) await update(ref(db,'sehaty_doctor_codes/'+profile.code), { name: upd.name, specialty: upd.specialty, clinic: upd.clinic });
  profile={...profile,...upd}; toast('تم تعديل ملف الطبيب بنجاح'); await renderDoctor();
};
window.deleteDoctorAccount = async ()=>{
  const w=document.getElementById('delWordD').value.trim(); if(w!=='حذف'){ toast('اكتب كلمة حذف بالضبط'); return; }
  if(!confirm('حذف نهائي لحساب الطبيب؟')) return;
  try{
    const uid=profile.uid;
    // unlink all patients
    for(let puid of Object.keys(cache.doctorPatients||{})){ try{ await remove(ref(db,'sehaty_links/'+puid)); }catch(e){} }
    await remove(ref(db,'sehaty_doctor_patients/'+uid));
    if(profile.code) await remove(ref(db,'sehaty_doctor_codes/'+profile.code));
    for(let r of cache.requests){ try{ await remove(ref(db,'sehaty_requests/'+r.id)); }catch(e){} }
    await remove(ref(db,'sehaty_profiles/'+uid));
    await deleteUser(auth.currentUser); profile=null; toast('تم حذف الحساب'); renderAuthChoice();
  }catch(e){ toast('تعذر حذف الحساب: '+e.message); }
};

// ---------- AUTH STATE ----------
onAuthStateChanged(auth, async (user)=>{
  if(!user){ profile=null; renderAuthChoice(); return; }
  // أظهر واجهة التحميل فورا حتى ما يبين البرنامج واقف
  try{ appEl.innerHTML = '<div class="card center"><h2>جارٍ تحميل حسابك...</h2><p class="muted">ثواني ويفتح ملفك</p></div>'; }catch(e){}
  try{
    const p = await loadProfile(user.uid);
    if(!p){ 
      appEl.innerHTML = `<div class="card"><h2>حسابك موجود، بس ملفك ما انحفظ</h2><p class="muted">هذا يصير إذا انقطع الاتصال أثناء التسجيل الأول. كمل بياناتك هنا وراح نكمل ملفك لنفس الحساب، لا تسوي حساب جديد.</p><label class="label">الاسم الكامل</label><input id="fix_name" placeholder="الاسم الكامل"><label class="label">رقم الهاتف (نفس اللي سجلت بيه)</label><input id="fix_phone" placeholder="07701234567" dir="ltr"><label class="label">الدور</label><select id="fix_role"><option value="patient">مريض</option><option value="doctor">طبيب</option></select><div style="margin-top:12px"><button class="btn" onclick="window.fixMissingProfile()">إكمال الملف والدخول</button></div><button class="btn ghost" style="margin-top:8px" onclick="window.doLogout()">تسجيل خروج</button></div>`;
      return; }
    profile=p;
    if(p.role==='doctor'){ currentTab='home'; await renderDoctor(); }
    else { currentTab='home'; await renderPatient(); }
  }catch(e){
    console.error(e);
    appEl.innerHTML = `<div class="card"><h2>تعذر تحميل الملف</h2><p class="muted">${esc(e.message)}</p><p class="muted">تأكد أنك فعلت Authentication Email/Password وطبقت القواعد الآمنة الجديدة. راجع خطوات التفعيل أسفل الرسالة.</p><button class="btn" onclick="window.doLogout()">تسجيل خروج</button></div>`;
  }
});

renderAuthChoice();
</script>
