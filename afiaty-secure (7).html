<head><style>

<meta charset="UTF-8">

<title>عافيتي - النسخة الآمنة</title>
<style>
:root{--bg:#f4f7f6;--card:#fff;--line:#dce7e6;--teal:#0f766e;--teal2:#0d9488;--muted:#64748b;--danger:#dc2626;--amber:#b45309}
*{box-sizing:border-box} body{margin:0;background:var(--bg);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:#0f172a}
a{color:var(--teal)} .wrap{max-width:1120px;margin:0 auto;padding:16px 16px 60px}
header{position:sticky;top:0;z-index:20;background:var(--bg);padding:10px 0 12px;display:flex;justify-content:space-between;align-items:center}
.logo{display:flex;gap:10px;align-items:center} .logoIcon{width:42px;height:42px;border-radius:12px;background:var(--teal);color:#fff;display:grid;place-items:center;font-size:22px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}
h1{font-size:22px;margin:0} h2{font-size:19px;margin:0 0 10px} h3{font-size:16px;margin:14px 0 8px}
p{line-height:1.7} .muted{color:var(--muted);font-size:13px;line-height:1.6}
.label{display:block;font-weight:700;margin:12px 0 6px;font-size:14px}
input,select,textarea{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;font-size:15px;background:#fff;font-family:inherit}
textarea{min-height:80px} .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px} @media(max-width:640px){.grid2{grid-template-columns:1fr}}
.btn{background:var(--teal);color:#fff;border:0;padding:12px 18px;border-radius:10px;font-weight:800;cursor:pointer;font-size:15px}
.btn.secondary{background:#e6f3f1;color:#0f766e} .btn.ghost{background:transparent;color:var(--teal)} .btn.danger{background:var(--danger);color:#fff}
.btn.small{padding:8px 12px;font-size:13px} .btn:disabled{opacity:.6;cursor:wait}
.flex{display:flex;gap:8px;flex-wrap:wrap;align-items:center} .between{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.badge{display:inline-block;background:#e6f3f1;color:#0f766e;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:700}
.badge.warn{background:#fef3c7;color:#92400e} .badge.red{background:#fee2e2;color:#991b1b}
.chip{border:1px solid var(--line);background:#f8fafc;padding:6px 10px;border-radius:999px;font-size:13px;cursor:pointer}
.chip.active{background:var(--teal);color:#fff;border-color:var(--teal)}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0} .tab{padding:10px 14px;border-radius:999px;border:1px solid var(--line);background:#fff;cursor:pointer;font-weight:700}
.tab.active{background:var(--teal);color:#fff;border-color:var(--teal)}
.item{border:1px solid var(--line);border-radius:12px;padding:12px;margin:10px 0;background:#fff}
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:10px} @media(max-width:640px){.stat{grid-template-columns:1fr}}
.stat div{background:#f8fafc;border:1px solid var(--line);border-radius:12px;padding:12px;text-align:center}
.stat b{font-size:20px;display:block}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#0f172a;color:#fff;padding:12px 16px;border-radius:12px;z-index:99;max-width:92%;text-align:center;font-size:14px}
.alert{background:#fef3c7;border:1px solid #f59e0b;color:#92400e;border-radius:10px;padding:10px 12px;font-size:13px;line-height:1.6}
.alert.green{background:#dcfce7;border-color:#86efac;color:#14532d}
.alert.red{background:#fee2e2;border-color:#fca5a5;color:#991b1b}
.secure{background:#ecfdf5;border:1px solid #6ee7b7;color:#065f46;border-radius:12px;padding:12px;font-size:13px;line-height:1.7}
code{background:#0f172a;color:#e2e8f0;padding:2px 6px;border-radius:6px;font-size:12px}
.small{font-size:12px;color:var(--muted)} .center{text-align:center}
.bar{height:8px;background:#e2e8f0;border-radius:999px;overflow:hidden} .bar i{display:block;height:100%;background:var(--teal)}
</style>
</head>
<body>
<div class="wrap">
<header>
<div class="logo"><div class="logoIcon">♥</div><div><strong style="font-size:18px">عافيتي</strong><div class="small">النسخة الآمنة 5 • تنبيهات حقيقية + نسيت كلمة السر + سريعة</div></div></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged, updatePassword, deleteUser, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getDatabase, ref, set, get, update, remove, push, query, orderByChild, equalTo, onValue } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyBG-xwxw6GuVhxL6mFsTlg0pJE6w_Oigtw",
  authDomain: "afiaty-app-c4d19.firebaseapp.com",
  databaseURL: "https://afiaty-app-c4d19-default-rtdb.firebaseio.com",
  projectId: "afiaty-app-c4d19",
  storageBucket: "afiaty-app-c4d19.firebasestorage.app",
  messagingSenderId: "517088634256",
  appId: "1:517088634256:web:491bcbdeda8acb5704ff15",
  measurementId: "G-D9KVXC9R2N"
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getDatabase(app);

const $ = s => document.querySelector(s);
const appEl = document.getElementById('app');
const toastWrap = document.getElementById('toastWrap');
let profile = null;
let currentTab = 'home';
let selectedPatientUid = null;
let selectedPatientProfile = null;
let cache = { measurements:{}, medicines:{}, reminders:{}, notes:{}, requests:[], doctorPatients:{}, link:null };

function toast(msg, ms=3500){ const d=document.createElement('div'); d.className='toast'; d.textContent=msg; toastWrap.appendChild(d); setTimeout(()=>d.remove(), ms); }
function esc(s){ return String(s??'').replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function normalizePhone(phone){ let d = String(phone||'').replace(/\D/g,''); if(!d) return ''; if(d.startsWith('00964')) d = '0' + d.slice(5); else if(d.startsWith('964') && d.length>=12) d = '0' + d.slice(3); else if(d.length===10 && d.startsWith('77')) d = '0' + d; return d; }
function phoneVariants(phone){ const c = normalizePhone(phone); const raw = String(phone||'').replace(/\D/g,''); const list=[]; const push=v=>{ if(v && !list.includes(v)) list.push(v); }; push(c); push(raw); if(c.startsWith('0')){ push('964'+c.slice(1)); push('00964'+c.slice(1)); } return list; }
function derivedEmail(phone){ return `u${normalizePhone(phone)}@afiaty.app`; }
function isRealEmail(email){ return email && !email.endsWith('@afiaty.app') && email.includes('@') && email.includes('.'); }
function isValidEmail(email){ return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email||''); }
async function lookupAuthEmailByPhone(phone){ for(const v of phoneVariants(phone)){ try{ const s = await get(ref(db,'sehaty_phone_to_email/'+v)); if(s.exists() && s.val() && s.val().email) return s.val(); }catch(e){} } return null; }
async function savePhoneMapping(phone, email, uid, recoveryEmail){ try{ await set(ref(db,'sehaty_phone_to_email/'+normalizePhone(phone)), { email, uid, recoveryEmail: recoveryEmail||'' }); }catch(e){ console.warn('savePhoneMapping failed', e); } }

// ===== نظام التنبيهات الحقيقي =====
let _remTimer = null;
function notifPerm(){ try{ return ('Notification' in window) ? Notification.permission : 'unsupported'; }catch(e){ return 'unsupported'; } }
async function requestNotifPerm(){ try{ if(!('Notification' in window)){ toast('متصفحك ما يدعم الإشعارات، راح يجيك تنبيه داخل التطبيق مع صوت'); return 'unsupported'; } const p = await Notification.requestPermission(); if(p==='granted'){ toast('تم تفعيل التنبيهات ✅ - هسه راح يوصلك إشعار بوقت الدواء'); } else { toast('ما انطيت إذن للإشعارات - راح يجيك تنبيه داخل التطبيق فقط'); } return p; }catch(e){ return 'denied'; } }
function playAlertSound(){ try{ const C = window.AudioContext || window.webkitAudioContext; if(!C) return; const ctx = new C(); for(let i=0;i<3;i++){ const o=ctx.createOscillator(); const g=ctx.createGain(); o.connect(g); g.connect(ctx.destination); o.frequency.value=880; o.type='sine'; const t=ctx.currentTime + i*0.6; g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.5,t+0.05); g.gain.exponentialRampToValueAtTime(0.0001,t+0.5); o.start(t); o.stop(t+0.55); } }catch(e){} }
function showBigAlert(rem){
  try{ if(navigator.vibrate) navigator.vibrate([500,200,500,200,500]); }catch(e){}
  playAlertSound();
  // إشعار المتصفح - يطلع حتى إذا كنت بتبويب ثاني أو طالع من كروم
  try{ if('Notification' in window && Notification.permission==='granted'){ new Notification('⏰ عافيتي - وقت ' + (rem.type||'تذكير'), { body: (rem.note||'') + ' - الساعة ' + rem.time, tag: 'afiaty-'+rem.id }); } }catch(e){}
  // تنبيه كبير داخل التطبيق - ما يروح إلا إذا دست تم
  let ov = document.getElementById('alertOverlay');
  if(!ov){ ov=document.createElement('div'); ov.id='alertOverlay'; ov.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:200;display:flex;align-items:center;justify-content:center;padding:16px'; document.body.appendChild(ov); }
  ov.innerHTML = `<div style="background:#fff;border-radius:16px;padding:22px;max-width:420px;width:100%;text-align:center"><div style="font-size:48px">⏰</div><h2 style="margin:8px 0">وقت ${esc(rem.type||'تذكير')}</h2><p style="font-size:18px;font-weight:700">الساعة ${esc(rem.time)}</p><p class="muted">${esc(rem.note||'')}</p><button class="btn" style="width:100%;padding:14px;font-size:16px" onclick="window.dismissAlert()">تم ✅ - أخذت الدواء</button><p class="muted" style="margin-top:10px">إذا كنت خارج التطبيق، افتح عافيتي وشوف التنبيه هنا.</p></div>`;
  ov.style.display='flex';
}
window.dismissAlert = ()=>{ const ov=document.getElementById('alertOverlay'); if(ov) ov.style.display='none'; };
function firedKey(remId, dateStr){ return 'afiaty_fired_'+dateStr+'_'+remId; }
function hasFiredToday(remId){ try{ return localStorage.getItem(firedKey(remId, new Date().toISOString().slice(0,10)))==='1'; }catch(e){ return false; } }
function markFired(remId){ try{ localStorage.setItem(firedKey(remId, new Date().toISOString().slice(0,10)), '1'); }catch(e){} }
function saveRemindersBackup(){ try{ if(profile) localStorage.setItem('afiaty_reminders_'+profile.uid, JSON.stringify(Object.entries(cache.reminders||{}).map(([id,v])=>({id,...v})))); }catch(e){} }
function loadRemindersBackup(){ try{ if(!profile) return []; const j=JSON.parse(localStorage.getItem('afiaty_reminders_'+profile.uid)||'[]'); return Array.isArray(j)?j:[]; }catch(e){ return []; } }
function shouldFireNow(rem, now){
  if(!rem || !rem.active || !rem.time) return false;
  const hh = String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0');
  if(rem.time !== hh) return false;
  if(hasFiredToday(rem.id)) return false;
  if(rem.repeat==='مرة واحدة' && rem.firedOnce) return false;
  if(rem.repeat==='أسبوعي'){ const created = rem.createdAt ? new Date(rem.createdAt).getDay() : null; if(created!==null && created!==now.getDay()) return false; }
  return true;
}
async function checkReminders(){
  if(!profile) return;
  const list = Object.entries(cache.reminders||{}).map(([id,v])=>({id,...v}));
  const src = list.length ? list : loadRemindersBackup();
  if(!src.length) return;
  const now = new Date();
  for(const rem of src){
    if(shouldFireNow(rem, now)){
      markFired(rem.id);
      showBigAlert(rem);
      if(rem.repeat==='مرة واحدة'){ try{ await update(ref(db,'sehaty_reminders/'+profile.uid+'/'+rem.id), { active:false, firedOnce:true }); }catch(e){} }
    }
  }
}
function startReminderScheduler(){
  if(_remTimer) clearInterval(_remTimer);
  checkReminders();
  _remTimer = setInterval(checkReminders, 20000);
  // فحص التنبيهات الفائتة أول ما تفتح التطبيق
  try{
    const now = new Date(); const list = Object.entries(cache.reminders||{}).map(([id,v])=>({id,...v}));
    for(const rem of list){
      if(!rem.active || !rem.time) continue;
      const [h,m] = rem.time.split(':').map(Number); const t = new Date(); t.setHours(h,m,0,0);
      const diffMin = (now - t)/60000;
      if(diffMin>=0 && diffMin<=60 && !hasFiredToday(rem.id) && rem.repeat!=='مرة واحدة'){
        // فاتك التنبيه خلال آخر ساعة وأنت مسكر التطبيق - نبهك هسه
        setTimeout(()=>{ if(!hasFiredToday(rem.id)){ markFired(rem.id); showBigAlert({...rem, note: (rem.note||'') + ' (فات وقته قبل قليل)'}); } }, 1500);
      }
    }
  }catch(e){}
}
window.testNotification = async ()=>{ const p = await requestNotifPerm(); const fake = { id:'test', type:'دواء', time: new Date().toLocaleTimeString('ar-IQ',{hour:'2-digit',minute:'2-digit'}), note:'هذا تنبيه تجريبي - إذا شفته والصوت اشتغل، معناها التنبيهات شغالة عندك' }; showBigAlert(fake); toast('هذا تنبيه تجريبي - إذا وصلك الإشعار والصوت، التنبيهات شغالة'); };
window.enableNotifications = async ()=>{ await requestNotifPerm(); await renderPatient(); };
function genCode(){ return 'DR-' + Math.floor(1000+Math.random()*9000); }
function fmtTime(t){ try{ return new Date(t).toLocaleString('ar-IQ',{dateStyle:'medium',timeStyle:'short'}); }catch(e){ return t||''; } }
function todayStr(){ return new Date().toISOString().slice(0,10); }

async function loadProfile(uid){
  const snap = await get(ref(db, 'sehaty_profiles/'+uid));
  return snap.exists() ? snap.val() : null;
}
async function loadOwnerData(ownerUid){
  const [m, med, rem, notes] = await Promise.all([
    get(ref(db, 'sehaty_measurements/'+ownerUid)),
    get(ref(db, 'sehaty_medicines/'+ownerUid)),
    get(ref(db, 'sehaty_reminders/'+ownerUid)),
    get(ref(db, 'sehaty_notes/'+ownerUid)),
  ]);
  cache.measurements = m.exists()? m.val() : {};
  cache.medicines = med.exists()? med.val() : {};
  cache.reminders = rem.exists()? rem.val() : {};
  cache.notes = notes.exists()? notes.val() : {};
}
async function loadLink(){
  if(!profile) return; const s = await get(ref(db, 'sehaty_links/'+profile.uid)); cache.link = s.exists()? s.val() : null;
}
async function loadDoctorData(){
  const snap = await get(ref(db, 'sehaty_doctor_patients/'+profile.uid));
  cache.doctorPatients = snap.exists()? snap.val() : {};
  // requests for doctor
  try{
    const q = query(ref(db,'sehaty_requests'), orderByChild('doctorUid'), equalTo(profile.uid));
    const rs = await get(q); cache.requests = rs.exists()? Object.entries(rs.val()).map(([id,v])=>({id,...v})) : [];
  }catch(e){ cache.requests=[]; }
}
async function loadPatientRequests(){
  try{
    const q = query(ref(db,'sehaty_requests'), orderByChild('patientUid'), equalTo(profile.uid));
    const rs = await get(q); cache.requests = rs.exists()? Object.entries(rs.val()).map(([id,v])=>({id,...v})) : [];
  }catch(e){ cache.requests=[]; }
}

// ---------- AUTH VIEWS ----------
function renderAuthChoice(){
  currentTab='home';
  appEl.innerHTML = `
  <div class="card center">
    <h1 style="font-size:26px">صحتك، وطبيبك، في مكان واحد.</h1>
    <p class="muted">تابع قياساتك اليومية، وافهم حالتك من خلال تحليل فوري، وابق على تواصل مع طبيبك بسهولة.</p>
    <div class="secure" style="text-align:right"><b>حماية جديدة:</b> كل حساب محمي بكلمة سر مشفرة، وكل مريض يشوف بياناته فقط. الطبيب يشوف مريض فقط بعد ما المريض يربط وياه ويقبل الطلب. الدخول هسه برقم الهاتف فقط، مو بالاسم، حتى لا أحد يكدر يدخل لحساب غيره.</div>
    <div class="flex center" style="justify-content:center;margin-top:14px">
      <button class="btn" onclick="window.goRegister()">تسجيل حساب جديد</button>
      <button class="btn secondary" onclick="window.goLogin()">تسجيل دخول لحساب موجود</button>
    </div>
    <div style="margin-top:14px"><button class="btn" style="background:#b45309;width:100%;padding:14px;font-size:16px" onclick="window.goForgot()">🔑 نسيت كلمة السر؟ اضغط هنا للاسترجاع بالإيميل</button></div>
    <p class="muted" style="margin-top:12px">الحسابات القديمة التجريبية انمسحت. إذا كان عندك حساب قديم، سوي حساب جديد هنا، راح ياخذ منك دقيقة.</p>
  </div>
  <div class="card"><h2>كيف تُحفظ بياناتك الآن؟</h2>
  <p class="muted"><b>الحسابات:</b> الاسم، رقم الهاتف، الدور، الجنس، العمر، الحالات، التخصص، كود الطبيب. <b>كلمة السر لا تُحفظ أبدا داخل قاعدة البيانات.</b></p>
  <p class="muted"><b>القياسات والأدوية والتنبيهات:</b> تُحفظ تحت رقم حسابك الخاص فقط، ولا يستطيع أي مستخدم آخر قراءتها.</p>
  <p class="muted"><b>ملاحظات الطبيب:</b> يراها أنت وطبيبك المرتبط بك فقط.</p>
  </div>`;
  document.getElementById('headerActions').innerHTML = '';
}

function renderRegister(){
  appEl.innerHTML = `
  <div class="card">
    <div class="flex"><button class="btn ghost" onclick="window.goChoice()">← عودة</button><h2 style="margin:0">تسجيل حساب جديد</h2></div>
    <p class="muted">أدخل بياناتك الحقيقية. كلمة السر لازم تكون 6 أحرف على الأقل، لأن هذا شرط أمان Firebase. كلمة السر تنحفظ مشفرة وما تنعرض لأي أحد.</p>
    <label class="label">الاسم الكامل</label><input id="r_name" placeholder="الاسم الكامل">
    <label class="label">رقم الهاتف</label><input id="r_phone" placeholder="مثال: 07701234567" dir="ltr">
    <p class="muted">الدخول بعدين راح يكون بنفس رقم الهاتف هذا بالضبط (0770...) + كلمة السر. احفظه بنفس الصيغة.</p>
    <label class="label">البريد الإلكتروني لاسترجاع كلمة السر (مهم)</label><input id="r_email" placeholder="مثال: name@gmail.com" dir="ltr">
    <p class="muted">إذا نسيت كلمة السر، راح نرسل لك رابط استرجاع على هذا الإيميل. إذا تركته فارغ، ما راح تكدر تسترجع كلمة السر.</p>
    <label class="label">كلمة السر (6 أحرف على الأقل)</label><input id="r_pass" type="password" placeholder="6 أحرف على الأقل">
    <label class="label">تأكيد كلمة السر</label><input id="r_pass2" type="password" placeholder="أعد كتابة كلمة السر">
    <label class="label">اختيار الدور</label>
    <div class="flex"><button type="button" class="chip active" id="role_patient" onclick="window.setRole('patient')">مريض</button><button type="button" class="chip" id="role_doctor" onclick="window.setRole('doctor')">طبيب</button></div>
    <div id="patientFields">
      <div class="grid2"><div><label class="label">العمر</label><input id="r_age" placeholder="مثال: 34"></div><div><label class="label">الجنس</label><select id="r_gender"><option>ذكر</option><option>أنثى</option></select></div></div>
      <label class="label">الحالات المزمنة</label><div class="flex" id="condWrap">
        ${['ضغط','سكري','ربو','قلب','لا توجد'].map(c=>`<label class="chip"><input type="checkbox" value="${c}" class="cond"> ${c}</label>`).join('')}
      </div>
    </div>
    <div id="doctorFields" style="display:none">

// ---------- ANALYSIS ----------
function analyze(measurements){
  const arr = Object.values(measurements||{}).sort((a,b)=> new Date(b.time)-new Date(a.time));
  if(!arr.length) return ['أضف قياسا جديدا لكي يظهر التحليل هنا.'];
  const out=[]; const last = arr[0];
  if(last.type==='ضغط' && last.sys){
    if(last.sys>=180 || last.dia>=120) out.push('انتبه: الضغط مرتفع جدا بشكل حرج. اجلس واسترح 15 دقيقة ثم أعد القياس، وتواصل مع طبيبك.');
    else if(last.sys>=140 || last.dia>=90) out.push('الضغط أعلى من النطاق العام. قلل الملح اليوم، وامش مشيا خفيفا إذا كان ذلك مناسبا لك.');
    else if(last.sys<90 || last.dia<60) out.push('الضغط أقل من النطاق العام. لا تقم فجأة، اشرب ماء، وأعد القياس بعد قليل.');
    else out.push('الضغط ضمن النطاق العام.');
  }
  if(last.type==='سكر' && last.value){
    if(last.value>=250) out.push('قراءة السكر حرجة جدا. تواصل مع طبيبك.');
    else if(last.value<70) out.push('السكر أقل من النطاق العام. اجلس، وتناول شيئا حلوا سريع الامتصاص إذا كان طبيبك قد نصحك بذلك من قبل، وأعد القياس بعد 15 دقيقة.');
    else if(last.value>180) out.push('السكر أعلى من النطاق العام. تجنب الحلويات الآن، واشرب ماء، وسجل القراءة التالية.');
    else out.push('السكر ضمن النطاق العام.');
  }
  out.push('ملاحظة ثابتة: هذا التحليل تعليمي عام من بيانات أدخلتها أنت، وليس تشخيصا، وقرار العلاج يبقى لطبيبك.');
  return out;
}

window.doRegister = async ()=>{
  const name=document.getElementById('r_name').value.trim(); const phone=document.getElementById('r_phone').value.trim();
  const pass=document.getElementById('r_pass').value; const pass2=document.getElementById('r_pass2').value;
  const recoveryEmail=(document.getElementById('r_email')?.value||'').trim().toLowerCase();
  const errEl=document.getElementById('regErr');
  const btnReg=document.getElementById('btnReg');
  if(!name||!phone){ errEl.textContent='أدخل الاسم الكامل ورقم الهاتف أولا'; return; }
  if(recoveryEmail && !isValidEmail(recoveryEmail)){ errEl.textContent='صيغة الإيميل غير صحيحة، مثال: name@gmail.com'; return; }
  if(!pass||pass.length<6){ errEl.textContent='اختر كلمة سر من 6 أحرف على الأقل'; return; }
  if(pass!==pass2){ errEl.textContent='كلمة السر وتأكيدها غير متطابقين'; return; }
  const role = window._role||'patient';
  const authEmail = recoveryEmail ? recoveryEmail : derivedEmail(phone);
  if(btnReg){ btnReg.disabled=true; btnReg.textContent='جارٍ إنشاء الحساب...'; }
  if(errEl) errEl.textContent='جارٍ إنشاء الحساب...';
  try{
    const cred = await createUserWithEmailAndPassword(auth, authEmail, pass);
    const uid = cred.user.uid;
    let prof = { uid, name, phone: normalizePhone(phone), role, createdAt: new Date().toISOString(), recoveryEmail: recoveryEmail||'', authEmail };
    if(role==='patient'){
      prof.age = document.getElementById('r_age').value.trim()||'';
      prof.gender = document.getElementById('r_gender').value;
      prof.conditions = Array.from(document.querySelectorAll('.cond:checked')).map(c=>c.value);
    } else {
      prof.specialty = document.getElementById('r_spec').value;
      prof.clinic = document.getElementById('r_clinic').value.trim();
      prof.code = genCode();
    }
    const saves = [ set(ref(db,'sehaty_profiles/'+uid), prof), savePhoneMapping(phone, authEmail, uid, recoveryEmail) ];
    if(role==='doctor') saves.push(set(ref(db,'sehaty_doctor_codes/'+prof.code), { uid, name, specialty: prof.specialty, clinic: prof.clinic||'' }));
    await Promise.all(saves);
    profile=prof; toast(recoveryEmail ? 'تم إنشاء الحساب بنجاح، وتم ربط إيميل الاسترجاع' : 'تم إنشاء الحساب بنجاح');
    if(role==='patient'){ currentTab='home'; await renderPatient(); } else { currentTab='home'; await renderDoctor(); }
  }catch(e){
    console.error(e);
    if(btnReg){ btnReg.disabled=false; btnReg.textContent='إنشاء الحساب والدخول'; }
    if(e.code==='auth/email-already-in-use') errEl.textContent = recoveryEmail ? 'هذا الإيميل مستخدم لحساب آخر، استخدم إيميل ثاني أو سجل دخول.' : 'هذا الرقم مسجل مسبقا، سجل دخول بدلا من إنشاء حساب جديد';
    else if(e.code==='auth/invalid-email') errEl.textContent='رقم الهاتف غير صحيح';
    else if(e.code==='auth/weak-password') errEl.textContent='كلمة السر ضعيفة، اختر 6 أحرف على الأقل';
    else if(e.code==='auth/network-request-failed') errEl.textContent='تعذر الوصول إلى Firebase، تأكد من الإنترنت';
    else errEl.textContent='تعذر إنشاء الحساب: '+(e.message||'');
  }
};
window.doLogin = async ()=>{
  const phone=document.getElementById('l_phone').value.trim(); const pass=document.getElementById('l_pass').value;
  const errEl=document.getElementById('loginErr');
  const btn=document.getElementById('btnLogin');
  if(!phone||!pass){ errEl.textContent='أدخل رقم الهاتف وكلمة السر'; return; }
  if(btn){ btn.disabled=true; btn.textContent='جارٍ الدخول...'; }
  if(errEl) errEl.textContent='جارٍ التحقق...';
  try{
    const m = await lookupAuthEmailByPhone(phone).catch(()=>null);
    const authEmail = (m && m.email) ? m.email : derivedEmail(phone);
    try{ await signInWithEmailAndPassword(auth, authEmail, pass); }
    catch(e){ if(m && m.email && m.email!==derivedEmail(phone) && e.code!=='auth/too-many-requests'){ await signInWithEmailAndPassword(auth, derivedEmail(phone), pass); } else throw e; }
    if(errEl) errEl.textContent='تم الدخول بنجاح...';
  }catch(e){
    if(btn){ btn.disabled=false; btn.textContent='دخول'; }
    if(e.code==='auth/invalid-credential' || e.code==='auth/user-not-found' || e.code==='auth/wrong-password') errEl.textContent='رقم الهاتف أو كلمة السر غير صحيحة. تأكد أن الرقم بنفس الصيغة 0770... وإذا نسيت كلمة السر استخدم صندوق الاسترجاع بالأسفل.';
    else if(e.code==='auth/too-many-requests') errEl.textContent='محاولات كثيرة، انتظر 5 دقائق ثم حاول مرة أخرى';
    else errEl.textContent='تعذر الدخول: '+(e.message||'');
    return;
  }
  if(btn){ btn.disabled=false; btn.textContent='دخول'; }
};

  const code=document.getElementById('linkCode').value.trim().toUpperCase(); if(!code){ toast('أدخل كود الطبيب'); return; }
  try{
    const cs = await get(ref(db,'sehaty_doctor_codes/'+code)); if(!cs.exists()){ toast('كود الطبيب غير صحيح، تأكد من الكود مع طبيب مسجل'); return; }
    const doc = cs.val(); if(cache.link && cache.link.doctorUid===doc.uid){ toast('أنت مربوط بهذا الطبيب بالفعل'); return; }
    if(cache.link && cache.link.doctorUid){ toast('أنت مربوط بطبيب آخر، ألغِ الربط أولا لتغيير الطبيب'); return; }
    if(cache.requests.find(r=>r.doctorUid===doc.uid && r.status==='pending')){ toast('لديك طلب ربط قيد الانتظار لدى هذا الطبيب، انتظر قبوله'); return; }
    const nr=push(ref(db,'sehaty_requests')); await set(nr, { doctorUid: doc.uid, doctorCode: code, doctorName: doc.name, patientUid: profile.uid, patientName: profile.name, patientPhone: profile.phone, status:'pending', createdAt: new Date().toISOString() });
    toast('تم إرسال طلب الربط، انتظر قبوله'); await renderPatient();
  }catch(e){ toast('تعذر إرسال الطلب: '+e.message); }
};
window.unlinkDoctor = async ()=>{
  if(!confirm('تأكيد إلغاء الربط مع الطبيب؟')) return;
  try{
    if(cache.link?.doctorUid) await remove(ref(db,'sehaty_doctor_patients/'+cache.link.doctorUid+'/'+profile.uid));
    await remove(ref(db,'sehaty_links/'+profile.uid)); toast('تم إلغاء الربط مع الطبيب'); await renderPatient();
  }catch(e){ toast('تعذر إلغاء الربط: '+e.message); }
};
window.deleteAccount = async ()=>{
  const w=document.getElementById('delWord').value.trim(); if(w!=='حذف'){ toast('اكتب كلمة حذف بالضبط للتأكيد'); return; }
  if(!confirm('حذف نهائي؟ لا يمكن التراجع.')) return;
  try{
    const uid=profile.uid;
    if(cache.link?.doctorUid) { try{ await remove(ref(db,'sehaty_doctor_patients/'+cache.link.doctorUid+'/'+uid)); }catch(e){} }
    await remove(ref(db,'sehaty_measurements/'+uid)); await remove(ref(db,'sehaty_medicines/'+uid)); await remove(ref(db,'sehaty_reminders/'+uid)); await remove(ref(db,'sehaty_notes/'+uid)); await remove(ref(db,'sehaty_links/'+uid));
    // delete own requests
    for(let r of cache.requests){ try{ await remove(ref(db,'sehaty_requests/'+r.id)); }catch(e){} }
    await remove(ref(db,'sehaty_profiles/'+uid));
    await deleteUser(auth.currentUser); profile=null; toast('تم حذف الحساب'); renderAuthChoice();
  }catch(e){ toast('تعذر حذف الحساب، سجل خروج ودخول مرة أخرى ثم حاول: '+e.message); }
};
// Doctor actions
window.copyText = async (t)=>{ try{ await navigator.clipboard.writeText(t); toast('تم النسخ'); }catch(e){ toast(t); } };
window.filterPatients = ()=>{ const q=(document.getElementById('searchPat').value||'').toLowerCase(); document.querySelectorAll('.patItem').forEach(el=>{ el.style.display = el.dataset.name.includes(q)?'block':'none'; }); };
window.openPatient = async (uid)=>{ selectedPatientUid=uid; selectedPatientProfile=await loadProfile(uid); currentTab='patients'; await renderDoctor(); };
window.closePatient = async ()=>{ selectedPatientUid=null; selectedPatientProfile=null; await renderDoctor(); };
window.acceptReq = async (rid, patientUid, patientName, patientPhone)=>{
  try{
    await update(ref(db,'sehaty_requests/'+rid), {status:'accepted'});
    await set(ref(db,'sehaty_doctor_patients/'+profile.uid+'/'+patientUid), { patientName, patientPhone, linkedAt: new Date().toISOString(), status:'accepted' });
    await set(ref(db,'sehaty_links/'+patientUid), { doctorUid: profile.uid, doctorName: profile.name, doctorCode: profile.code, doctorPhone: profile.phone, status:'accepted', updatedAt: new Date().toISOString() });
    toast('تم قبول طلب الربط، وأضيف المريض إلى قائمتك'); await renderDoctor();
  }catch(e){ toast('تعذر قبول الطلب: '+e.message); }
};
window.rejectReq = async (rid)=>{ await update(ref(db,'sehaty_requests/'+rid), {status:'rejected'}); toast('تم الرفض'); await renderDoctor(); };
window.unlinkPatient = async (patientUid)=>{ if(!confirm('إلغاء ربط هذا المريض؟')) return; await remove(ref(db,'sehaty_doctor_patients/'+profile.uid+'/'+patientUid)); await remove(ref(db,'sehaty_links/'+patientUid)); toast('تم إلغاء الربط'); await renderDoctor(); };
window.addNote = async (patientUid)=>{ const text=document.getElementById('noteText').value.trim(); if(!text){ toast('اكتب ملاحظتك الطبية'); return; } const nr=push(ref(db,'sehaty_notes/'+patientUid)); await set(nr, { patientUid, doctorUid: profile.uid, doctorName: profile.name, text, date: new Date().toISOString(), createdAt: new Date().toISOString() }); toast('تم حفظ ملاحظة الطبيب'); await renderDoctor(); };
window.delNote = async (patientUid, nid)=>{ if(!confirm('حذف الملاحظة؟')) return; await remove(ref(db,'sehaty_notes/'+patientUid+'/'+nid)); await renderDoctor(); };
window.doctorAddMeas = async (patientUid)=>{
  const type=document.getElementById('dm_type').value; const time=document.getElementById('dm_time').value || new Date().toISOString();
  let data={ type, time: new Date(time).toISOString(), notes:'أضيف من الطبيب', ownerUid: patientUid, createdBy: profile.uid, createdAt: new Date().toISOString() };
  if(type==='ضغط'){ data.sys=document.getElementById('dm_sys').value; data.dia=document.getElementById('dm_dia').value; if(!data.sys||!data.dia){ toast('أدخل قيمتي الضغط'); return; } }
  else { data.value=document.getElementById('dm_val').value; if(!data.value){ toast('أدخل القيمة'); return; } }
  const nr=push(ref(db,'sehaty_measurements/'+patientUid)); await set(nr,data); toast('تمت إضافة قياس للمريض بنجاح'); await renderDoctor();
};
window.doctorAddMed = async (patientUid)=>{
  const name=document.getElementById('dm_med').value.trim(); if(!name){ toast('أدخل اسم الدواء'); return; }
  const nr=push(ref(db,'sehaty_medicines/'+patientUid)); await set(nr, { name, dose: document.getElementById('dm_dose').value, time:'', note:'أضيف من الطبيب', ownerUid: patientUid, takenToday:false, createdAt: new Date().toISOString() }); toast('تمت إضافة دواء للمريض بنجاح'); await renderDoctor();
};
window.saveDoctorProfile = async ()=>{
  const upd={ name: document.getElementById('d_name').value.trim(), specialty: document.getElementById('d_spec').value.trim(), clinic: document.getElementById('d_clinic').value.trim() };
  await update(ref(db,'sehaty_profiles/'+profile.uid), upd);
  if(profile.code) await update(ref(db,'sehaty_doctor_codes/'+profile.code), { name: upd.name, specialty: upd.specialty, clinic: upd.clinic });
  profile={...profile,...upd}; toast('تم تعديل ملف الطبيب بنجاح'); await renderDoctor();
};
window.deleteDoctorAccount = async ()=>{
  const w=document.getElementById('delWordD').value.trim(); if(w!=='حذف'){ toast('اكتب كلمة حذف بالضبط'); return; }
  if(!confirm('حذف نهائي لحساب الطبيب؟')) return;
  try{
    const uid=profile.uid;
    // unlink all patients
    for(let puid of Object.keys(cache.doctorPatients||{})){ try{ await remove(ref(db,'sehaty_links/'+puid)); }catch(e){} }
    await remove(ref(db,'sehaty_doctor_patients/'+uid));
    if(profile.code) await remove(ref(db,'sehaty_doctor_codes/'+profile.code));
    for(let r of cache.requests){ try{ await remove(ref(db,'sehaty_requests/'+r.id)); }catch(e){} }
    await remove(ref(db,'sehaty_profiles/'+uid));
    await deleteUser(auth.currentUser); profile=null; toast('تم حذف الحساب'); renderAuthChoice();
  }catch(e){ toast('تعذر حذف الحساب: '+e.message); }
};

// ---------- AUTH STATE ----------
onAuthStateChanged(auth, async (user)=>{
  if(!user){ profile=null; renderAuthChoice(); return; }
  try{
    const p = await loadProfile(user.uid);
    if(!p){ appEl.innerHTML = `<div class="card"><h2>الحساب موجود لكن الملف غير مكتمل</h2><p class="muted">هذا الحساب أنشئ في Authentication لكن لا يوجد ملف له. سجل خروج وسجل حساب جديد، أو تواصل مع الدعم.</p><button class="btn" onclick="window.doLogout()">تسجيل خروج</button></div>`; return; }
    profile=p;
    if(p.role==='doctor'){ currentTab='home'; await renderDoctor(); }
    else { currentTab='home'; await renderPatient(); saveRemindersBackup(); startReminderScheduler(); }
  }catch(e){
    console.error(e);
    appEl.innerHTML = `<div class="card"><h2>تعذر تحميل الملف</h2><p class="muted">${esc(e.message)}</p><p class="muted">تأكد أنك فعلت Authentication Email/Password وطبقت القواعد الآمنة الجديدة. راجع خطوات التفعيل أسفل الرسالة.</p><button class="btn" onclick="window.doLogout()">تسجيل خروج</button></div>`;
  }
});

renderAuthChoice();
</script>
